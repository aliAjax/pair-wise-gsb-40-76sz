<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海上搜救协调</title>
<style>
body{font:15px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:1280px;margin:30px auto;padding:0 20px;color:#17324d;background:#fbfdff}
h1{margin-bottom:8px}.card{background:#f0f7fd;border-left:5px solid #2784c7;padding:12px 16px;margin:16px 0}
table{border-collapse:collapse;width:100%;margin:14px 0;background:#fff}th,td{border:1px solid #cbd8e3;padding:8px;vertical-align:top;text-align:left}th{background:#edf5fb;white-space:nowrap}
code{background:#f2f5f7;padding:2px 5px;border-radius:3px}.tag{display:inline-block;padding:1px 7px;border-radius:10px;background:#e7f0f8;font-size:12px}.tag.review_required,.tag.pending_review{background:#fff0d6;color:#8a5300}.tag.merged,.tag.continued,.tag.transferred{background:#e3f6ea;color:#196637}.tag.undone,.tag.reverted{background:#eef0f3;color:#4b5563}.tag.legacy,.tag.historical{background:#ece8fd;color:#4c35a0}.tag.held_for_review{background:#ffe8e8;color:#922}
details summary{cursor:pointer;font-weight:600}.json{max-width:420px;white-space:pre-wrap;word-break:break-word;font-size:12px}.muted{color:#64748b}.timeline{background:#fff;border:1px solid #cbd8e3;padding:12px 28px}.relation{font-weight:600;color:#0f5f99}
</style>
<h1>海上搜救协调</h1>
<div class="card">页面实时展示事件、资源接续、待复核冲突和可撤销归并的前后关系。业务写入通过 JSON API 完成，并需要 <code>X-User</code>、<code>X-Role</code>。</div>

<h2>遇险事件</h2>
<table id="incidents"><thead><tr><th>编号</th><th>船名</th><th>状态</th><th>海况</th><th>负责机构</th><th>版本</th><th>重复指向</th></tr></thead><tbody></tbody></table>

<h2>可撤销归并</h2>
<table id="merges"><thead><tr><th>归并号</th><th>前：从事件</th><th>后：主事件</th><th>状态</th><th>接续/转移</th><th>待复核</th><th>线索前后</th><th>撤销信息</th><th>明细</th></tr></thead><tbody></tbody></table>

<h2>资源</h2>
<table id="assets"><thead><tr><th>名称</th><th>类型</th><th>能力</th><th>状态</th><th>航程(km)</th><th>版本</th></tr></thead><tbody></tbody></table>

<h2>搜索区域</h2>
<table id="areas"><thead><tr><th>编号</th><th>当前事件</th><th>状态</th><th>优先级</th><th>资源</th><th>版本</th></tr></thead><tbody></tbody></table>

<h2>最近时间线</h2><ol id="timeline" class="timeline"></ol>

<script>
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const tag = value => `<span class="tag ${esc(value)}">${esc(value)}</span>`;
const json = value => `<pre class="json">${esc(JSON.stringify(value, null, 2))}</pre>`;
const incidentCode = (state, id) => {
  const item = state.incidents.find(x => x.id === id);
  return item ? `${esc(item.code)} / ${esc(item.vessel_name)}` : `#${esc(id)}`;
};
const fill = (id, rows, renderer) => {
  document.querySelector('#' + id + ' tbody').innerHTML = rows.map(renderer).join('');
};
async function load() {
  const d = await fetch('/api/state').then(r => r.json());
  fill('incidents', d.incidents, r => `<tr><td>${esc(r.code)}</td><td>${esc(r.vessel_name)}</td><td>${tag(r.status)}</td><td>${esc(r.sea_state)}</td><td>${esc(r.lead_org)}</td><td>${esc(r.version)}</td><td>${r.duplicate_of ? incidentCode(d, r.duplicate_of) : ''}</td></tr>`);
  fill('assets', d.assets, r => `<tr><td>${esc(r.name)}</td><td>${esc(r.kind)}</td><td>${esc(JSON.parse(r.capabilities).join(', '))}</td><td>${tag(r.status)}</td><td>${esc(r.range_km)}</td><td>${esc(r.version)}</td></tr>`);
  fill('areas', d.search_areas, r => `<tr><td>${esc(r.code)}</td><td>#${esc(r.incident_id)}</td><td>${tag(r.status)}</td><td>${esc(r.priority)}</td><td>${esc(r.assigned_asset_id ?? '')}</td><td>${esc(r.version)}</td></tr>`);
  fill('merges', d.incident_merges || [], m => {
    const before = m.pre_merge_snapshot?.incident || {};
    const beforeIncident = `${esc(before.code || '')} / ${esc(before.vessel_name || '')}<br><span class="muted">状态 ${esc(before.status || '')} · 版本 ${esc(before.version ?? '')}</span>`;
    const continued = (m.changes || []).filter(x => ['continued','transferred'].includes(x.action) && x.record_type === 'search_area').length;
    const held = (m.conflicts || []).filter(x => x.status === 'pending_review').length;
    const clues = (m.changes || []).filter(x => x.record_type === 'clue');
    const clueText = `${clues.filter(x => x.after_incident_id === m.primary_incident_id).length} 条转主事件<br>${clues.filter(x => x.after_incident_id === m.duplicate_incident_id).length} 条留待复核`;
    const undo = m.undone_at ? `${esc(m.undone_by)}<br>${esc(m.undone_at)}${m.undo_reason ? `<br><span class="muted">${esc(m.undo_reason)}</span>` : ''}` : (m.reversible ? '可撤销' : '仅历史追溯');
    const detailRows = (m.changes || []).map(x => `<tr><td>${esc(x.record_type)}</td><td>#${esc(x.record_id)}</td><td>${tag(x.action)}</td><td>#${esc(x.before_incident_id ?? '')} → #${esc(x.after_incident_id ?? '')}</td><td>v${esc(x.before_version)}${x.undone ? ' → 已恢复' : ''}</td></tr>`).join('');
    const conflicts = (m.conflicts || []).map(x => `<div>${tag(x.status)} <strong>${esc(x.code)}</strong>${json(x.details)}</div>`).join('');
    return `<tr><td><strong>${esc(m.merge_code)}</strong><br><span class="muted">${esc(m.created_at)}</span>${m.client_merge_id ? `<br><code>${esc(m.client_merge_id)}</code>` : ''}</td><td><span class="relation">${beforeIncident}</span></td><td><span class="relation">${incidentCode(d, m.primary_incident_id)}</span><br><span class="muted">主事件值与版本不被归并修改</span></td><td>${tag(m.status)}</td><td>${continued} 个区域/任务</td><td>${held} 项</td><td>${clueText}</td><td>${undo}</td><td><details><summary>变更与冲突</summary><table><thead><tr><th>类型</th><th>记录</th><th>动作</th><th>归属</th><th>版本</th></tr></thead><tbody>${detailRows}</tbody></table>${conflicts}</details></td></tr>`;
  });
  document.querySelector('#timeline').innerHTML = d.timeline.slice(0,25).map(x => `<li><strong>${esc(x.created_at)}</strong> ${tag(x.action)} <code>#${esc(x.incident_id ?? '')}</code> ${esc(x.actor)} ${json(JSON.parse(x.details))}</li>`).join('');
}
load();
</script>
</html>
